# DL3 data pipeline: refresh the LIHTC data in the cloud and propose it to the website as a pull request.
#
# Run it: GitHub > Actions > "DL3 data pipeline" > Run workflow (on the development branch).
#
#   1. "collect" (has the API keys, runs only pipeline code, never npm):
#        pulls the pipeline's database + archived documents from the here.now Drive,
#        fetches every source in the register, parses award lists, optionally extracts rules with
#        Gemini and/or re-crawls the 50-state inventory, writes the coverage report and the website's
#        data files, then pushes the updated database back to the Drive.
#   2. "propose" (NO secrets): copies the new data files into the site, runs the site's tests and
#        build, and opens a pull request into development so a person checks it before it goes live.
#
# Nothing here approves a rule. Gemini findings stay "pending review" until a named reviewer imports
# a decision (python -m src.review.import_review, then python -m src.state_store push).
# The review packet for new findings is in the run's "pipeline-reports" download.
#
# Settings > Secrets and variables > Actions:
#   secret   CENSUS_API_KEY        Census API key (top-100 metro screen)
#   secret   GEMINI_API_KEY        only needed when "extract" is ticked
#   secret   HERENOW_DRIVE_TOKEN   made with: cd dl3-lihtc-model && python -m src.state_store make-token
#   variable GEMINI_MODEL          optional, e.g. gemini-3.5-flash-lite
#   variable DL3_CONTACT           optional contact shown to agency sites in the crawler's user agent
# Settings > Actions > General: tick "Allow GitHub Actions to create and approve pull requests"
# (otherwise the job pushes the branch and prints a link to open the pull request by hand).
name: DL3 data pipeline

on:
  workflow_dispatch:
    inputs:
      extract:
        description: "Extract rules with Gemini (costs API credit; findings go to review, never straight to the site)"
        type: boolean
        default: false
      inventory:
        description: "Re-crawl agency sites for the 50-state inventory: 'all', some IDs like 'MI OH', or blank to skip"
        type: string
        default: ""
      coverage_states:
        description: "States for the coverage checklist"
        type: string
        default: "MI OH IN"

permissions:
  contents: read

concurrency:
  group: dl3-data-pipeline   # one run at a time: they share one database on the Drive
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: dl3-lihtc-model
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HERENOW_DRIVE_TOKEN: ${{ secrets.HERENOW_DRIVE_TOKEN }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      DL3_CONTACT: ${{ vars.DL3_CONTACT }}
      INPUT_EXTRACT: ${{ inputs.extract }}
      INPUT_INVENTORY: ${{ inputs.inventory }}
      INPUT_STATES: ${{ inputs.coverage_states }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check settings
        run: |
          missing=""
          [ -n "$HERENOW_DRIVE_TOKEN" ] || missing="$missing HERENOW_DRIVE_TOKEN"
          [ -n "$CENSUS_API_KEY" ] || missing="$missing CENSUS_API_KEY"
          if [ "$INPUT_EXTRACT" = "true" ] && [ -z "$GEMINI_API_KEY" ]; then missing="$missing GEMINI_API_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing (see the top of .github/workflows/pipeline.yml)"
            exit 1
          fi
          case "$INPUT_INVENTORY $INPUT_STATES" in
            *[!A-Za-z0-9_\ ]*) echo "::error::inventory and coverage_states take letters, digits and spaces only"; exit 1;;
          esac

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dl3-lihtc-model/requirements.txt

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Pipeline tests
        run: python -m pytest -q

      - name: Get the latest database and documents from here.now
        run: python -m src.state_store pull

      - name: Run the pipeline
        id: run
        run: |
          args="--awards"
          [ "$INPUT_EXTRACT" = "true" ] && args="$args --extract"
          inv="$(echo "$INPUT_INVENTORY" | xargs)"
          if [ "$inv" = "all" ]; then args="$args --inventory"; elif [ -n "$inv" ]; then args="$args --inventory $inv"; fi
          echo "python run_all.py $args"
          set +e
          python run_all.py $args 2>&1 | tee ../run_all.txt
          code=${PIPESTATUS[0]}
          set -e
          # 1 = some sources failed to download: reported in the change report, not fatal.
          if [ "$code" -gt 1 ]; then echo "::error::run_all.py stopped with exit code $code"; exit "$code"; fi
          if [ "$code" -eq 1 ]; then echo "::warning::Some sources failed to download; see the change report."; fi

      # Save progress (documents and Gemini calls cost time and money) before anything else can fail.
      - name: Save the database and documents to here.now
        run: python -m src.state_store push

      - name: Reports and website files
        run: |
          python -m src.awards.costs
          python -m src.report.coverage $INPUT_STATES | tee ../coverage.txt
          if [ "$INPUT_EXTRACT" = "true" ]; then python -m src.review.build_packet; fi
          python -m src.report.export_web --site

      - name: Summary
        if: always()
        run: |
          {
            echo "## DL3 data pipeline"
            echo '```'
            tail -n 40 ../run_all.txt 2>/dev/null || echo "(the pipeline did not start)"
            echo '```'
            if [ -f ../coverage.txt ]; then echo '### Coverage'; echo '```'; cat ../coverage.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Data files for the website (public: they are committed to this public repository).
      - uses: actions/upload-artifact@v7
        with:
          name: site-data
          retention-days: 7
          path: |
            dl3-lihtc-model/data/web/
            dl3-lihtc-model/data/inventory/
            dl3-lihtc-model/data/reference/
            src/ranking/data/pipeline/
            src/ranking/data/inventory.csv

      # For people: change report, coverage, award rows to check, review packet. Never the database or keys.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-reports
          retention-days: 30
          if-no-files-found: ignore
          path: |
            run_all.txt
            coverage.txt
            dl3-lihtc-model/outputs/runs/
            dl3-lihtc-model/outputs/coverage/
            dl3-lihtc-model/outputs/awards/
            dl3-lihtc-model/review/packets/

  propose:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site-data
          path: .

      - name: Anything new?
        id: diff
        run: |
          git add -A dl3-lihtc-model/data src/ranking/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changed since the last run; no pull request needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat | tail -n 25
          fi

      - uses: actions/setup-node@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Site tests and build with the new data
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Open a pull request into development
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="data-refresh/$(date -u +%Y-%m-%d)-run${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -q -m "Refresh pipeline data ($(date -u +%Y-%m-%d))" -m "From $RUN_URL"
          git push -q origin "$branch"
          body="The data pipeline ran in GitHub Actions and refreshed the data the site reads.

          - What changed: see the files in this pull request (approved rules, award rows, cost per unit, metro screen, documents, inventory).
          - Only reviewer-approved rules appear on the site. New Gemini findings wait in the review packet (the run's **pipeline-reports** download).
          - Site tests and build passed with this data.

          Run log: $RUN_URL"
          if ! gh pr create --base development --head "$branch" --title "Refresh pipeline data ($(date -u +%Y-%m-%d))" --body "$body"; then
            echo "::warning::Could not open the pull request automatically (Settings > Actions > General > allow GitHub Actions to create pull requests). Open it here: ${{ github.server_url }}/${{ github.repository }}/compare/development...$branch"
          fi
